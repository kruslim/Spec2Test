# Gold-set source documents (docs/PLAN.md, "Eval plan").
#
# Only this manifest and README.md are committed. The documents stay in this folder,
# git-ignored. `uv run spec2test corpora fetch` downloads the `fetch = "auto"` ones and
# checks their sha256. Put the `fetch = "manual"` ones here yourself, then run
# `uv run spec2test corpora status` to see their hashes.

